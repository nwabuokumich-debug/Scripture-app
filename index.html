<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Scripture Search — KJV Bible</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e74252" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scripture" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&family=Josefin+Sans:wght@300;400;600&family=Lato:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;500;600&family=Open+Sans:ital,wght@0,400;0,600;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@400;500;600&family=Roboto:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=90" />
</head>
<body>

  <div class="app">
    <main id="bible-pane" class="pane is-active" aria-hidden="false">
      <header class="top-bar">
        <div class="top-bar-main">
          <button id="book-picker-btn" class="book-chip" type="button" title="Choose book">
            <span class="book-chip-main">
              <span id="book-chip-title" class="book-chip-title">Choose Book</span>
              <span id="book-chip-sub" class="book-chip-sub">Old Testament</span>
            </span>
            <svg class="book-chip-caret" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="m5 7.5 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button id="translation-label" class="top-translation" type="button">KJV</button>
        </div>
        <div class="top-bar-actions">
          <button id="account-btn" class="icon-btn" type="button" title="Account">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="10" cy="6.3" r="3.1" stroke="currentColor" stroke-width="1.6"/>
              <path d="M4.8 16.2c.7-2.6 2.8-4.2 5.2-4.2s4.5 1.6 5.2 4.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="search-open" class="icon-btn" type="button" title="Search Bible">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.7"/>
              <path d="m14 14 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="settings-btn" class="icon-btn settings-btn" type="button" title="Reader settings">Aa</button>
        </div>

      </header>

      <div id="chapter-bar" class="chapter-bar"></div>

      <div id="bible-content" class="content-area">
        <div id="verse-area" class="verse-area">
          <div class="state-msg">
            <strong>Scripture</strong>
            Choose a book to begin reading
          </div>
        </div>
      </div>
    </main>

    <main id="stacks-pane" class="pane" aria-hidden="true">
      <header class="top-bar stacks-top-bar">
        <h1 class="stacks-pane-title">Stacks</h1>
        <div class="stacks-top-actions">
          <div class="stacks-top-meta-actions">
            <button id="import-stacks-btn" class="secondary-pill-btn stacks-utility-btn" type="button">Import</button>
            <button id="export-stacks-btn" class="secondary-pill-btn stacks-utility-btn" type="button">Export</button>
            <button id="auth-open-btn" class="secondary-pill-btn auth-open-btn" type="button">Local Only</button>
          </div>
          <button id="new-stack-btn" class="primary-pill-btn stacks-create-btn" type="button">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>New Stack</span>
          </button>
        </div>
      </header>

      <div id="stacks-content" class="content-area">
        <div class="stacks-shell">
          <section id="stacks-summary" class="stacks-summary"></section>
          <section id="stack-list" class="stack-rail"></section>
          <section id="stack-detail" class="stack-detail"></section>
        </div>
      </div>
    </main>

    <nav class="bottom-nav" aria-label="Primary">
      <button id="nav-bible" class="nav-item active" type="button" aria-current="page">
        <svg class="nav-ico nav-ico-outline" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 4v16h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 16h-12a2 2 0 0 0 -2 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 7v6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 9h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="nav-ico nav-ico-filled nav-ico-bible-active" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 4v16h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M19 16h-12a2 2 0 0 0 -2 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 7v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 9h4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="nav-label">Bible</span>
      </button>
      <button id="nav-stacks" class="nav-item" type="button">
        <svg class="nav-ico nav-ico-outline" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 4 4.5 8 12 12 19.5 8 12 4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M4.5 12 12 16l7.5-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4.5 16 12 20l7.5-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="nav-ico nav-ico-filled" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3.8 3.6 8.2a1 1 0 0 0 0 1.76L12 14.2l8.4-4.24a1 1 0 0 0 0-1.76L12 3.8Zm-7.35 9.74L12 17.4l7.35-3.86 1.11.56a1 1 0 0 1 0 1.8L12 20.2l-8.46-4.3a1 1 0 0 1 0-1.8l1.11-.56Z"/>
        </svg>
        <span class="nav-label">Stacks</span>
      </button>
    </nav>
  </div>

  <div id="book-sheet-backdrop" class="sheet-backdrop hidden">
    <div id="book-sheet" class="sheet book-sheet">
      <div id="book-sheet-drag-zone" class="book-sheet-drag-zone">
        <div class="sheet-handle"></div>
        <div class="book-sheet-header">
        <button id="book-sheet-close" class="sheet-text-btn" type="button">Cancel</button>
        <div class="sheet-title">Books</div>
        </div>
      </div>
      <div id="book-list" class="book-list"></div>
      <div class="book-sheet-footer">
        <div class="segmented book-order-seg">
          <button id="tab-ot" class="seg active" type="button">Traditional</button>
          <button id="tab-nt" class="seg" type="button">Alphabetical</button>
        </div>
      </div>
    </div>
  </div>

  <div id="search-sheet-backdrop" class="sheet-backdrop hidden">
    <div class="sheet search-sheet">
      <div class="search-sheet-header">
        <div class="search-pill">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/>
            <path d="m14.5 14.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <input id="search-input" type="text" placeholder="Search words or enter a passage" autocomplete="off" />
          <button id="search-btn" class="search-submit" type="button">Search</button>
        </div>
        <button id="search-close" class="search-cancel" type="button">Close</button>
      </div>
      <div id="search-results" class="search-results">
        <div class="search-empty">Search within the selected translation or jump to a passage reference.</div>
      </div>
    </div>
  </div>

  <div id="settings-sheet-backdrop" class="sheet-backdrop hidden settings-sheet-backdrop">
    <div id="settings-panel" class="sheet settings-panel">
      <div class="sp-handle" aria-hidden="true"></div>
      <div class="sp-toolbar">
        <button id="sp-size-down" class="sp-toolbar-btn sp-size-step" type="button" aria-label="Decrease font size">
          <span class="sp-size-step-label sp-size-step-small">A</span>
        </button>
        <button id="sp-size-up" class="sp-toolbar-btn sp-size-step" type="button" aria-label="Increase font size">
          <span class="sp-size-step-label sp-size-step-large">A</span>
        </button>
        <button id="sp-font-toggle" class="sp-toolbar-btn sp-toolbar-icon" type="button" aria-label="Show font choices" aria-expanded="false">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M5 6.5h10M5 10h10M5 13.5h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <button id="sp-font-summary" class="sp-font-summary" type="button" aria-expanded="false">
        <span class="sp-font-meta">
          <span class="sp-summary-label">Font</span>
          <span id="sp-font-current" class="sp-current-value">Source Serif 4</span>
        </span>
        <span class="sp-chevron" aria-hidden="true">›</span>
      </button>
      <div class="sp-font-list hidden" id="sp-font-list"></div>
      <div class="sp-section sp-section-soft">
        <div class="sp-label">Appearance</div>
        <div class="sp-theme-grid">
          <button class="sp-theme-btn sp-theme-card active" data-theme="light" type="button" aria-label="Light theme">
            <span class="sp-theme-preview sp-theme-preview-light" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
          </button>
          <button class="sp-theme-btn sp-theme-card" data-theme="dark" type="button" aria-label="Dark theme">
            <span class="sp-theme-preview sp-theme-preview-dark" aria-hidden="true">
              <span></span><span></span><span></span>
            </span>
          </button>
        </div>
      </div>
      <div class="sp-section sp-section-soft">
        <div class="sp-label">Spacing</div>
        <div class="sp-row sp-row-spaced">
          <button class="sp-spacing-btn" data-spacing="1.6">Compact</button>
          <button class="sp-spacing-btn active" data-spacing="2.1">Normal</button>
          <button class="sp-spacing-btn" data-spacing="2.7">Relaxed</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Greek analysis overlay -->
  <div id="greek-page" class="greek-page hidden"></div>

  <!-- Compare translations modal -->
  <div id="compare-backdrop" class="compare-backdrop hidden">
    <div id="compare-sheet" class="compare-sheet">
      <div class="compare-header">
        <span id="compare-ref" class="compare-ref"></span>
        <button id="compare-close" class="compare-close">✕</button>
      </div>
      <div id="compare-body" class="compare-body"></div>
    </div>
  </div>

  <!-- Custom modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-title" id="modal-title"></div>
      <input class="modal-input" id="modal-input" type="text" autocomplete="off" />
      <div class="modal-btns">
        <button class="modal-cancel" id="modal-cancel">Cancel</button>
        <button class="modal-confirm" id="modal-confirm">OK</button>
      </div>
    </div>
  </div>

  <div id="auth-backdrop" class="modal-backdrop hidden">
    <div class="modal auth-modal">
      <div class="modal-title">Account</div>
      <div id="auth-copy" class="auth-copy">Sign in if you already have an account, or create one here to sync your stacks across devices.</div>
      <input class="modal-input" id="auth-email" type="email" placeholder="Email" autocomplete="email" />
      <input class="modal-input" id="auth-password" type="password" placeholder="Password" autocomplete="current-password" />
      <div id="auth-feedback" class="auth-feedback hidden"></div>
      <div class="auth-btn-row">
        <button class="modal-confirm" id="auth-sign-in">Sign In</button>
        <button class="modal-cancel" id="auth-sign-up">Create Account</button>
      </div>
      <button class="auth-sign-out hidden" id="auth-sign-out" type="button">Sign Out</button>
      <div class="modal-btns auth-close-row">
        <button class="modal-cancel" id="auth-close" type="button">Close</button>
      </div>
    </div>
  </div>

  <input id="import-stacks-file" type="file" accept="application/json,.json" class="hidden" />

  <script src="config.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <script type="module" src="app.js?v=84"></script>

</body>
</html>
