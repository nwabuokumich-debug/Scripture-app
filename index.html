<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Scripture Search — KJV Bible</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e74252" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scripture" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&family=Josefin+Sans:wght@300;400;600&family=Lato:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Nunito:wght@400;500;600&family=Open+Sans:ital,wght@0,400;0,600;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:wght@400;500;600&family=Roboto:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Spectral:ital,wght@0,400;0,500;1,400&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=25" />
</head>
<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon">✦</div>
          <div class="brand-text">
            <h1>Scripture</h1>
            <span>KJV</span>
          </div>
        </div>
        <button id="sidebar-close" class="sidebar-toggle" title="Close sidebar" style="font-size:1.5rem;padding:6px 12px;background:#f5f1ed;border-radius:8px;color:#1a1a1a;border:1px solid #d9d1c7;">✕</button>
      </div>

      <div class="sidebar-tabs">
        <button id="tab-ot" class="stab active">Old</button>
        <button id="tab-nt" class="stab">New</button>
        <button id="tab-stacks" class="stab">Stacks</button>
      </div>

      <div id="book-list" class="book-list"></div>
      <div id="stack-list" class="stack-list hidden"></div>

      <div id="stacks-footer" class="stacks-footer hidden">
        <button id="new-stack-btn">+ New Stack</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-col">

      <header>
        <button id="sidebar-open" class="sidebar-open" title="Open sidebar">☰</button>
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.5"/><path d="m14.5 14.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="search-input" type="text" placeholder="Search any word or phrase…" autocomplete="off" />
          <button id="search-btn">Search</button>
        </div>
        <button id="settings-btn" class="settings-btn" title="Reader settings">Aa</button>

        <!-- Settings panel -->
        <div id="settings-panel" class="settings-panel hidden">
          <div class="sp-header">
            <span class="sp-title">Reader Settings</span>
            <button id="settings-close" class="sp-close">×</button>
          </div>
          <div class="sp-section">
            <div class="sp-label">Theme</div>
            <div class="sp-row">
              <button class="sp-theme-btn active" data-theme="light">☀ Light</button>
              <button class="sp-theme-btn" data-theme="dark">☾ Dark</button>
            </div>
          </div>
          <div class="sp-section">
            <div class="sp-label">Size</div>
            <div class="sp-row">
              <button class="sp-size-btn" data-size="0.9rem" style="font-size:0.78rem">A</button>
              <button class="sp-size-btn active" data-size="1.08rem" style="font-size:1rem">A</button>
              <button class="sp-size-btn" data-size="1.25rem" style="font-size:1.22rem">A</button>
              <button class="sp-size-btn" data-size="1.45rem" style="font-size:1.45rem">A</button>
            </div>
          </div>
          <div class="sp-section">
            <div class="sp-label">Spacing</div>
            <div class="sp-row">
              <button class="sp-spacing-btn" data-spacing="1.6">Compact</button>
              <button class="sp-spacing-btn active" data-spacing="2.1">Normal</button>
              <button class="sp-spacing-btn" data-spacing="2.7">Relaxed</button>
            </div>
          </div>
          <div class="sp-section">
            <div class="sp-label">Font</div>
            <div class="sp-font-list" id="sp-font-list"></div>
          </div>
        </div>
      </header>

      <div id="chapter-bar" class="chapter-bar"></div>

      <div id="verse-area" class="verse-area">
        <div class="state-msg">
          <strong>Scripture Search</strong>
          Select a book from the sidebar<br>or search for any keyword above
        </div>
      </div>

    </div>
  </div>

  <!-- Greek analysis overlay -->
  <div id="greek-page" class="greek-page hidden"></div>

  <!-- Custom modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-title" id="modal-title"></div>
      <input class="modal-input" id="modal-input" type="text" autocomplete="off" />
      <div class="modal-btns">
        <button class="modal-cancel" id="modal-cancel">Cancel</button>
        <button class="modal-confirm" id="modal-confirm">OK</button>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
  <script type="module" src="app.js?v=26"></script>

</body>
</html>
